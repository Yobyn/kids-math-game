<div class="grade-container">
  <h1>{{ languageService.translate('select-grade') }}</h1>

  <!-- One tap for a child who has already answered this question once. The
       ten cards stay below it: this offers, it does not decide. -->
  <button type="button"
          class="carry-on"
          *ngIf="carryOnGrade"
          (click)="selectGrade(carryOnGrade)">
    {{ carryOnLabel }}
  </button>

  <h2 class="or-pick" *ngIf="carryOnGrade">
    {{ languageService.translate('or-pick-another') }}
  </h2>

  <div class="grade-cards">
    <div class="grade-card"
         *ngFor="let grade of grades"
         role="button"
         tabindex="0"
         [class.suggested]="grade.level === suggestedGrade"
         [attr.aria-label]="grade.name
           + (grade.level === suggestedGrade
              ? ' — ' + languageService.translate('ready-to-try')
              : '')"
         (click)="selectGrade(grade.level)"
         (keydown.enter)="selectGrade(grade.level)"
         (keydown.space)="selectGrade(grade.level)">
      <div class="grade-icon">{{ grade.icon }}</div>
      <h2>{{ grade.name }}</h2>
      <p>{{ grade.description }}</p>
      <p class="suggestion" *ngIf="grade.level === suggestedGrade">
        {{ languageService.translate('ready-to-try') }}
      </p>
    </div>
  </div>

  <!-- The way to the character. Named and drawn, because the only route to it
       used to be an unlabelled circle in the header: findable by anyone using
       a screen reader, invisible to everyone else. -->
  <button type="button" class="your-character" (click)="openCharacter()">
    <app-avatar [avatar]="avatar" [size]="40"></app-avatar>
    <span>{{ languageService.translate('your-character') }}</span>
  </button>

  <!-- The way in for an adult. Plain text, no colour and no icon, below ten
       grade cards, so it is nothing a child is drawn towards; the gate on
       the other side is what actually keeps them out. -->
  <button type="button" class="grown-ups-link" (click)="openAdults()">
    {{ languageService.translate('for-grown-ups') }}
  </button>
</div>
