<app-particles></app-particles>

<header class="app-header" *ngIf="username || isGuest">
  <div class="header-content">
    <div class="welcome-message">
      <button type="button"
              class="welcome-icon avatar-button"
              (click)="openCharacter()"
              [attr.aria-label]="languageService.translate('your-character')"
              [title]="languageService.translate('your-character')">
        <app-avatar [avatar]="avatar" [size]="44"></app-avatar>
      </button>
      <div class="welcome-text">
        <span class="welcome-greeting">{{ languageService.translate('welcome') }}, {{ username || languageService.translate('guest-player') }}!</span>
        <span class="welcome-subtitle">{{ languageService.translate('lets-learn') }}</span>
      </div>
    </div>
    <div class="header-actions">
      <app-language-selector></app-language-selector>
      <button class="sound-btn"
              type="button"
              (click)="toggleSound()"
              [attr.aria-pressed]="soundEnabled"
              [attr.aria-label]="languageService.translate(soundEnabled ? 'sound-on' : 'sound-off')"
              [title]="languageService.translate(soundEnabled ? 'sound-on' : 'sound-off')">
        <span class="sound-icon">{{ soundEnabled ? '🔊' : '🔇' }}</span>
      </button>
      <button class="logout-btn" *ngIf="username" (click)="logout()">
        <span class="logout-icon">👋</span>
        <span>{{ languageService.translate('logout') }}</span>
      </button>
      <button class="logout-btn" *ngIf="!username" (click)="signIn()">
        <span class="logout-icon">🔑</span>
        <span>{{ languageService.translate('sign-in') }}</span>
      </button>
    </div>
  </div>
</header>

<!-- A new version, offered between rounds and nowhere else. It is a strip
     below the header rather than a dialog: nothing a child is doing needs to
     stop for it, and "later" is a real answer. -->
<div class="update-offer" *ngIf="showUpdate" role="status">
  <span class="update-text">{{ languageService.translate('update-ready') }}</span>
  <span class="update-actions">
    <button type="button" class="update-yes" (click)="takeUpdate()">
      {{ languageService.translate('update-now') }}
    </button>
    <button type="button" class="update-later" (click)="laterUpdate()">
      {{ languageService.translate('update-later') }}
    </button>
  </span>
</div>

<router-outlet></router-outlet>

<!-- The tap layer goes here, last, so it draws over everything. It is loaded
     after the first screen: see loadTapLayer in app.component.ts -->
<ng-container #tapLayer></ng-container>
