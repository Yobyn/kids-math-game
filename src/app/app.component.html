<app-particles></app-particles>

<header class="app-header" *ngIf="username || isGuest">
  <div class="header-content">
    <div class="welcome-message">
      <div class="welcome-icon">🧮</div>
      <div class="welcome-text">
        <span class="welcome-greeting">{{ languageService.translate('welcome') }}, {{ username || languageService.translate('guest-player') }}!</span>
        <span class="welcome-subtitle">{{ languageService.translate('lets-learn') }}</span>
      </div>
    </div>
    <div class="header-actions">
      <app-language-selector></app-language-selector>
      <button class="sound-btn"
              type="button"
              (click)="toggleSound()"
              [attr.aria-pressed]="soundEnabled"
              [attr.aria-label]="languageService.translate(soundEnabled ? 'sound-on' : 'sound-off')"
              [title]="languageService.translate(soundEnabled ? 'sound-on' : 'sound-off')">
        <span class="sound-icon">{{ soundEnabled ? '🔊' : '🔇' }}</span>
      </button>
      <button class="logout-btn" *ngIf="username" (click)="logout()">
        <span class="logout-icon">👋</span>
        <span>{{ languageService.translate('logout') }}</span>
      </button>
      <button class="logout-btn" *ngIf="!username" (click)="signIn()">
        <span class="logout-icon">🔑</span>
        <span>{{ languageService.translate('sign-in') }}</span>
      </button>
    </div>
  </div>
</header>

<router-outlet></router-outlet>
