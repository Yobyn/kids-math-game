<svg class="number-line" [attr.viewBox]="'0 0 ' + width + ' ' + height" role="img" [attr.aria-label]="label">
  <!-- The line, a little past both ends, with an arrowhead on each: the numbers go on -->
  <line class="axis" [attr.x1]="left - 12" [attr.x2]="right + 12" [attr.y1]="y" [attr.y2]="y"></line>
  <path class="axis-end" [attr.d]="'M' + (left - 16) + ' ' + y + ' l7 -4.5 v9 z'"></path>
  <path class="axis-end" [attr.d]="'M' + (right + 16) + ' ' + y + ' l-7 -4.5 v9 z'"></path>
  <line *ngFor="let mark of marks" class="mark" [class.big]="mark.size === 'big'" [class.half]="mark.size === 'half'"
        [attr.x1]="mark.x" [attr.x2]="mark.x"
        [attr.y1]="y - (mark.size === 'big' ? 8 : mark.size === 'half' ? 6 : 4)"
        [attr.y2]="y + (mark.size === 'big' ? 8 : mark.size === 'half' ? 6 : 4)"></line>
  <ng-container *ngFor="let mark of marks">
    <text *ngIf="mark.text !== null" class="number" [attr.x]="mark.x" [attr.y]="y + 23" text-anchor="middle">{{ mark.text }}</text>
  </ng-container>
  <!-- The arrow, pointing down at its mark -->
  <g class="arrow" [attr.transform]="'translate(' + arrowX + ' 0)'">
    <line x1="0" x2="0" y1="3" y2="16"></line>
    <path d="M-6 13 L0 23 L6 13 z"></path>
  </g>
</svg>
