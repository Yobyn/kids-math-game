<img *ngIf="still"
     class="avatar still"
     [src]="still"
     [attr.width]="size"
     [attr.height]="height"
     alt="Your character">
<svg class="avatar"
     *ngIf="!still"
     [attr.width]="size"
     [attr.height]="height"
     [attr.viewBox]="viewBox"
     [attr.style]="vars"
     role="img"
     aria-label="Your character"
     focusable="false">
  <!-- A hat worn over the head hides the hair above its brim, so it sits on
       the head instead of floating on top of the hair -->
  <clipPath *ngIf="layers.coversHair" [attr.id]="clipId">
    <rect x="-60" [attr.y]="layers.hatLine" width="220" height="220"></rect>
  </clipPath>

  <!-- Back to front: what hangs behind the head, the body, the head, the
       hair over it, then what is worn -->
  <g class="back" [attr.clip-path]="clipRef">
    <use *ngIf="layers.back" [attr.href]="part(layers.back)"></use>
  </g>
  <use *ngIf="layers.body" class="body" [attr.href]="part(layers.body)"></use>
  <use class="ears" [attr.href]="part(layers.ears)"></use>
  <use class="face" [attr.href]="part(layers.face)"></use>
  <use class="brows" [attr.href]="part(layers.brows)"></use>
  <use class="eyes" [attr.href]="part(layers.eyes)"></use>
  <use class="mouth" [attr.href]="part(layers.mouth)"></use>
  <g class="front" [attr.clip-path]="clipRef">
    <use class="hair" [attr.href]="part(layers.hair)"></use>
  </g>
  <use *ngIf="layers.glasses" class="glasses" [attr.href]="part(layers.glasses)"></use>
  <use *ngIf="layers.hat" class="hat" [attr.href]="part(layers.hat)"></use>
</svg>
