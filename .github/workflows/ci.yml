name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here needs write access to the repository
permissions:
  contents: read

# A newer push to the same branch supersedes the run in flight
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Angular 12 ships webpack 4, whose hashing breaks on OpenSSL 3
      NODE_OPTIONS: --openssl-legacy-provider
      CHROME_BIN: /usr/bin/google-chrome

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Build script tests
        run: npm run test:scripts

      - name: Unit tests
        run: npm run test:ci -- --code-coverage

      # Kept even when the tests fail — that is when the report is worth reading
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 14
          if-no-files-found: warn

      # The server was never covered by CI, which is how an unwired database
      # model and a users array sat in it unnoticed. No install step: these
      # run on node --test, which needs nothing, and server/node_modules is
      # checked in anyway (see the roadmap).
      - name: Server tests
        run: npm test
        working-directory: server

      - name: Upload production build
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error
